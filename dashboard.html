
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Catch Part Time</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#090909;color:white;font-family:Arial;padding:20px}
.card{max-width:650px;margin:30px auto;padding:25px;background:#191919;border:1px solid #c5a34d;border-radius:14px}
h1,h2{color:#e2bd61}
a{display:block;color:#e2bd61;padding:14px;margin-top:12px;border:1px solid #555;border-radius:8px;text-decoration:none}
button{padding:13px;background:#d5b45d;border:0;border-radius:7px;width:100%;margin-top:20px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>Catch Part Time</h1>
<h2>Welcome to your dashboard!</h2>
<p id="userEmail">Checking your account...</p>
<a href="index.html">Home</a>
<a href="register.html">Register another account</a>
<a href="login.html">Login page</a>
<div id="status"></div>
<button id="logout">LOG OUT</button>
</div>
<script>
const db=window.supabase.createClient(
"https://cgpzbyugpvslfwzihvxv.supabase.co",
"sb_publishable_wWRijS6oia3VEYLB3tlifQ_uaTiOa9p"
);

async function checkUser(){
const {data,error}=await db.auth.getUser();
if(error || !data.user){
location.replace("login.html");
return;
}
document.getElementById("userEmail").textContent=
"Logged in as: "+data.user.email;
}
checkUser();

document.getElementById("logout").onclick=async()=>{
await db.auth.signOut();
location.replace("login.html");
};
</script>
</body>
</html>
